[package]
name = "obctl"
version = "4.0.0"
edition = "2021"
authors = ["Openbox Development Team"]
license = "GPL-2.0-or-later"
description = "Openbox control utility - D-Bus CLI tool"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
tabled = "0.14"

# D-Bus
zbus = { version = "3.14", features = ["tokio"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
