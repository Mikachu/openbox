name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # C/C++ build and test
  build-c:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        distro: [ubuntu-22.04, ubuntu-20.04]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    
    container:
      image: ${{ matrix.distro }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          ${{ matrix.compiler }} \
          meson \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libx11-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxft-dev \
          libglib2.0-dev \
          valgrind \
          xvfb \
          x11-utils

    - name: Configure
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        meson setup build \
          --buildtype=debug \
          -Db_coverage=true

    - name: Build
      run: ninja -C build

    - name: Run tests
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1280x1024x24 &
        sleep 2
        meson test -C build --verbose

    - name: Memory test with Valgrind
      run: |
        export DISPLAY=:99
        valgrind --error-exitcode=1 --leak-check=full \
          ./build/openbox/openbox --version || true

    - name: Generate coverage report
      run: |
        ninja -C build coverage
        gcovr -r . --xml -o coverage.xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  # Rust build and test
  build-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [stable, nightly]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable
      with:
        toolchain: ${{ matrix.rust-version }}
        components: clippy, rustfmt

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxml2-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libx11-dev \
          xvfb

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Build
      run: cargo build --workspace

    - name: Run tests
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1280x1024x24 &
        sleep 2
        cargo test --workspace

    - name: Run benchmarks
      run: cargo bench --workspace

    - name: Generate coverage
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --out Xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false

  # Static analysis
  static-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-tidy \
          cppcheck \
          libxml2-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libx11-dev

    - name: Run cppcheck
      run: |
        cppcheck \
          --enable=all \
          --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          -I. \
          openbox/ \
          obt/ \
          obrender/ \
          2>&1 | tee cppcheck-report.txt

    - name: Upload cppcheck report
      uses: actions/upload-artifact@v3
      with:
        name: cppcheck-report
        path: cppcheck-report.txt

    - name: Run clang-tidy
      run: |
        find openbox obt obrender -name "*.c" -not -path "*/tests/*" | \
        xargs clang-tidy \
          --checks='bugprone-*,clang-analyzer-*,cppcoreguidelines-*,modernize-*,performance-*,portability-*,readability-*' \
          -- \
          -I. \
          $(pkg-config --cflags glib-2.0 cairo pangocairo libxml-2.0 x11) \
          2>&1 | tee clang-tidy-report.txt || true

    - name: Upload clang-tidy report
      uses: actions/upload-artifact@v3
      with:
        name: clang-tidy-report
        path: clang-tidy-report.txt

  # AddressSanitizer build
  asan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          meson \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libx11-dev \
          xvfb

    - name: Build with AddressSanitizer
      env:
        CFLAGS: "-fsanitize=address -fno-omit-frame-pointer -g"
        LDFLAGS: "-fsanitize=address"
      run: |
        meson setup build-asan --buildtype=debug
        ninja -C build-asan

    - name: Run tests with ASan
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1280x1024x24 &
        sleep 2
        meson test -C build-asan --verbose

  # Docker build
  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t openbox:test -f docker/Dockerfile.build .

    - name: Run tests in Docker
      run: |
        docker run --rm \
          -e DISPLAY=:99 \
          openbox:test \
          /bin/bash -c "
            Xvfb :99 -screen 0 1280x1024x24 &
            sleep 2
            cd /openbox && meson test -C build
          "

  # Python tests
  python-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          python3-gi \
          python3-dbus

    - name: Install Python packages
      run: |
        pip install \
          pytest \
          pytest-xvfb \
          pytest-cov \
          hypothesis \
          dbus-python \
          PyGObject

    - name: Run Python tests
      run: |
        pytest tests/python/ \
          --xvfb \
          --cov=openbox_dbus \
          --cov-report=xml \
          --cov-report=html

    - name: Upload Python coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  # Documentation
  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          doxygen \
          graphviz \
          python3 \
          python3-pip

    - name: Generate documentation
      run: |
        doxygen Doxyfile
        python3 tools/generate-dbus-docs.py

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          docs/html/
          docs/DBUS_API_GENERATED.md

  # Release build
  release:
    runs-on: ubuntu-latest
    needs: [build-c, build-rust, static-analysis]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4

    - name: Build release
      run: |
        docker build -t openbox:release -f docker/Dockerfile.release .
        docker create --name extract openbox:release
        docker cp extract:/openbox/dist ./dist

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
